<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="碎碎念" />
  <meta name="theme-color" content="#ff8a65" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>碎碎念 · 语音日记</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">碎碎念</span>
      </div>
      <button id="btnSettings" class="icon-btn" aria-label="设置">⚙︎</button>
    </header>

    <main class="screen" id="screenCapture">
      <section class="capture-card">
        <p class="capture-hint" id="captureHint">点麦克风开始说，会一直听，再点一下自动保存</p>
        <div class="mic-wrap">
          <button id="btnMic" class="mic-btn" aria-label="开始说话">
            <span class="mic-glyph">🎙️</span>
          </button>
        </div>
        <div class="live-text" id="liveText" hidden></div>
        <textarea id="inputBox" class="input-box" rows="3" placeholder="也可以在这里直接打字，或点文本框后再点键盘上的麦克风按钮说话…"></textarea>
        <div class="capture-actions">
          <button id="btnCancelEdit" class="ghost-btn" hidden>取消修改</button>
          <button id="btnSave" class="primary-btn">保存这条碎碎念</button>
        </div>
      </section>

      <div class="report-banner" id="reportBanner" hidden>
        <div class="report-banner-text">
          <strong>昨天有 <span id="bannerCount">0</span> 条碎碎念</strong>
          <span>点我生成今日回顾</span>
        </div>
        <button id="btnGenFromBanner" class="ghost-btn">生成报告</button>
      </div>

      <div class="report-banner backup-banner" id="backupBanner" hidden>
        <div class="report-banner-text">
          <strong>📦 好久没备份啦</strong>
          <span>超过 7 天没导出备份，点我去存一份更安全</span>
        </div>
        <button id="btnBackupNow" class="ghost-btn">去备份</button>
      </div>

      <section class="today-wrap">
        <div class="section-head">
          <h2>今天的碎碎念</h2>
          <span class="count-pill" id="todayCount">0 条</span>
        </div>
        <div class="entries" id="todayEntries"></div>
      </section>
    </main>

    <main class="screen" id="screenAll" hidden>
      <div class="section-head">
        <h2>全部记录</h2>
      </div>
      <div class="entries" id="allEntries"></div>
    </main>

    <main class="screen" id="screenReport" hidden>
      <div class="section-head">
        <h2>今日回顾</h2>
        <button id="btnGenReport" class="ghost-btn">生成昨日报告</button>
      </div>
      <div class="reports" id="reportList"></div>
    </main>

    <main class="screen" id="screenTrash" hidden>
      <div class="section-head">
        <h2>回收站 <span class="count-pill" id="trashCount">0</span></h2>
        <button id="btnEmptyTrash" class="ghost-btn">清空</button>
      </div>
      <p class="trash-tip">这里放着被删掉的碎碎念，30 天后会自动清空。误删了点 ♻️ 就能找回。</p>
      <div class="entries" id="trashEntries"></div>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="capture"><span>🏠</span><label>记录</label></button>
      <button class="tab" data-tab="all"><span>📜</span><label>全部</label></button>
      <button class="tab" data-tab="report"><span>🌿</span><label>回顾</label></button>
      <button class="tab" data-tab="trash"><span>🗑️</span><label>回收站</label></button>
    </nav>
  </div>

  <!-- 设置弹层 -->
  <div class="sheet-mask" id="settingsMask" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3>设置</h3>
        <button id="btnCloseSettings" class="icon-btn">✕</button>
      </div>
      <div class="sheet-body">
        <label class="field">
          <span>DeepSeek API Key</span>
          <input id="inputApiKey" type="password" placeholder="粘贴你的 key，如 sk-..." autocomplete="off" />
          <small>用于自动生成报告。去 platform.deepseek.com 注册即可拿到，很便宜。不填也能用，只是报告要手动发给我。</small>
        </label>
        <label class="field">
          <span>提醒时间</span>
          <input id="inputNotifyTime" type="time" value="09:00" />
          <small>每天这个时间点，打开 App 时会提醒你来看昨天的回顾。</small>
        </label>
        <button id="btnExport" class="ghost-btn wide">复制全部碎碎念给小巴</button>
        <div class="backup-row">
          <button id="btnExportFile" class="ghost-btn wide">⬇️ 导出备份到文件</button>
          <button id="btnImportFile" class="ghost-btn wide">⬆️ 从备份文件恢复</button>
          <input type="file" id="fileImport" accept="application/json" hidden />
        </div>
        <p class="backup-tip">⚠️ 手机清缓存或删 App 会丢数据，建议定期把备份存到「文件」App 或隔空投送给自己。</p>
        <button id="btnClearAll" class="danger-btn wide">清空所有数据</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
